name: Set up project pnpm
description: Install the packageManager version through Corepack and cache the pnpm store
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        package-manager-cache: false
    - name: Enable project package manager
      shell: bash
      env:
        COREPACK_DEFAULT_TO_LATEST: "0"
      run: |
        npm install --global corepack@0.36.0 --no-audit --no-fund
        corepack enable pnpm
        corepack install
    - name: Locate pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
