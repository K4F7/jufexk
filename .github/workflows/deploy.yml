name: Deploy Worker
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".grok/**"
  workflow_dispatch:
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "web=true"
          else
            bash scripts/ci/list-changed-paths.sh | node scripts/ci/classify-changed-paths.mjs
          fi

  deploy:
    name: deploy
    needs: changes
    if: needs.changes.outputs.web == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Deploy Worker
        run: pnpm exec wrangler deploy --env=""
      - name: Deploy preview Worker
        run: |
          if grep -q "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee" wrangler.jsonc; then
            echo "jufexk-preview D1 id is still the placeholder; run pnpm db:create-preview"
            exit 0
          fi
          pnpm exec wrangler deploy --env preview
