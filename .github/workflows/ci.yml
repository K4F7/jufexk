name: CI
on:
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.classify.outputs.web }}
      offline: ${{ steps.classify.outputs.offline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/list-changed-paths.sh | node scripts/ci/classify-changed-paths.mjs

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check

  offline:
    name: offline
    needs: changes
    if: needs.changes.outputs.web != 'true' && needs.changes.outputs.offline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler types
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run --config vitest.legacy-evidence.config.ts
      - run: pnpm run test:legacy-ocr-contract

  check:
    name: check
    needs: [changes, web, offline]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate required check
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          web="${{ needs.web.result }}"
          offline="${{ needs.offline.result }}"
          echo "changes=$changes web=$web offline=$offline"
          if [[ "$changes" != "success" ]]; then
            exit 1
          fi
          if [[ "$web" != "success" && "$web" != "skipped" ]]; then
            exit 1
          fi
          if [[ "$offline" != "success" && "$offline" != "skipped" ]]; then
            exit 1
          fi
