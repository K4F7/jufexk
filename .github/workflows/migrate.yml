name: Migrate D1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "migrations/**"
concurrency:
  group: production-migrate
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  migrate:
    name: migrate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: List pending D1 migrations
        run: |
          pnpm exec wrangler d1 migrations list jufexk --remote
          if grep -q "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee" wrangler.jsonc; then
            echo "jufexk-preview D1 id is still the placeholder; skip preview list"
          else
            pnpm exec wrangler d1 migrations list jufexk-preview --env preview --remote
          fi
      - name: Apply D1 migrations
        run: |
          pnpm exec wrangler d1 migrations apply jufexk --remote
          if grep -q "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee" wrangler.jsonc; then
            echo "jufexk-preview D1 id is still the placeholder; skip preview migrate"
          else
            pnpm exec wrangler d1 migrations apply jufexk-preview --env preview --remote
          fi
