name: Backfill teacher departments
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/teacher-department-backfill.yml"
      - "scripts/teacher-department-backfill/**"
      - "src/teacher-department-backfill.ts"
concurrency:
  group: production-teacher-department-backfill
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backfill:
    name: backfill
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Plan catalog-first then CTA fallback fills
        run: pnpm teacher-dept-backfill
      - name: Write empty teacher departments to production D1
        run: pnpm exec tsx scripts/teacher-department-backfill/apply-remote.ts --remote --apply
