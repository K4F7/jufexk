name: FTS5 preview capability smoke

on:
  workflow_dispatch:

concurrency:
  group: fts5-preview-capability-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    # The repository currently stores the Cloudflare token only in this
    # environment. The job is guarded below so it can touch only preview D1.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_DATABASE_NAME: jufexk-preview
      PRODUCTION_DATABASE_ID: 7bd119f3-b8a2-4c9d-9e70-2809396ee26c
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve isolated preview D1
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          info="$(pnpm exec wrangler d1 list --json)"
          database_id="$(printf '%s' "$info" | jq -r --arg name "$PREVIEW_DATABASE_NAME" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          if [[ -z "$database_id" || "$database_id" == "null" ]]; then
            pnpm exec wrangler d1 create "$PREVIEW_DATABASE_NAME" --location wnam
            info="$(pnpm exec wrangler d1 list --json)"
            database_id="$(printf '%s' "$info" | jq -r --arg name "$PREVIEW_DATABASE_NAME" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          fi
          [[ -n "$database_id" && "$database_id" != "null" ]]
          [[ "$database_id" != "$PRODUCTION_DATABASE_ID" ]]
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "Resolved isolated preview D1: $PREVIEW_DATABASE_NAME"
      - name: Run isolated FTS5 trigram smoke
        env:
          PREVIEW_DATABASE_ID: ${{ steps.preview.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIEW_DATABASE_ID" != "$PRODUCTION_DATABASE_ID" ]]
          pnpm exec wrangler d1 execute "$PREVIEW_DATABASE_NAME" --remote --json --command "SELECT sqlite_version() AS sqlite_version; DROP TABLE IF EXISTS smoke_fts; DROP TABLE IF EXISTS smoke_content; CREATE TABLE smoke_content(id INTEGER PRIMARY KEY,match_text TEXT NOT NULL,pinyin_text TEXT NOT NULL); CREATE VIRTUAL TABLE smoke_fts USING fts5(match_text,pinyin_text,content='smoke_content',content_rowid='id',tokenize='trigram'); CREATE TRIGGER smoke_ai AFTER INSERT ON smoke_content BEGIN INSERT INTO smoke_fts(rowid,match_text,pinyin_text) VALUES(new.id,new.match_text,new.pinyin_text); END; CREATE TRIGGER smoke_ad AFTER DELETE ON smoke_content BEGIN INSERT INTO smoke_fts(smoke_fts,rowid,match_text,pinyin_text) VALUES('delete',old.id,old.match_text,old.pinyin_text); END; CREATE TRIGGER smoke_au AFTER UPDATE ON smoke_content BEGIN INSERT INTO smoke_fts(smoke_fts,rowid,match_text,pinyin_text) VALUES('delete',old.id,old.match_text,old.pinyin_text); INSERT INTO smoke_fts(rowid,match_text,pinyin_text) VALUES(new.id,new.match_text,new.pinyin_text); END; INSERT INTO smoke_content(id,match_text,pinyin_text) VALUES(1,'江西财经大学 course catalog','jiangxicaijingdaxue course catalog'); INSERT INTO smoke_fts(smoke_fts) VALUES('rebuild'); SELECT 'zh' kind,COUNT(*) n FROM smoke_fts WHERE smoke_fts MATCH '财经大'; SELECT 'ascii' kind,COUNT(*) n FROM smoke_fts WHERE smoke_fts MATCH 'ourse'; SELECT 'pinyin' kind,COUNT(*) n FROM smoke_fts WHERE smoke_fts MATCH 'aijing'; INSERT INTO smoke_content(id,match_text,pinyin_text) VALUES(2,'教师评价系统','jiaoshipingjiaxitong'); SELECT 'insert' kind,COUNT(*) n FROM smoke_fts WHERE smoke_fts MATCH '师评价'; UPDATE smoke_content SET match_text='课程评价系统',pinyin_text='kechengpingjiaxitong' WHERE id=2; SELECT 'update_old' kind,COUNT(*) n FROM smoke_fts WHERE smoke_fts MATCH '师评价'; SELECT 'update_new' kind,COUNT(*) n FROM smoke_fts WHERE smoke_fts MATCH '程评价'; DELETE FROM smoke_content WHERE id=2; SELECT 'delete' kind,COUNT(*) n FROM smoke_fts WHERE smoke_fts MATCH '程评价'; EXPLAIN QUERY PLAN SELECT rowid FROM smoke_fts WHERE smoke_fts MATCH '财经大';" > /tmp/fts-smoke.json
          jq -e '[.[] | .results[]? | select(.kind == "zh") | .n] == [1]' /tmp/fts-smoke.json
          jq -e '[.[] | .results[]? | select(.kind == "ascii") | .n] == [1]' /tmp/fts-smoke.json
          jq -e '[.[] | .results[]? | select(.kind == "pinyin") | .n] == [1]' /tmp/fts-smoke.json
          jq -e '[.[] | .results[]? | select(.kind == "insert") | .n] == [1]' /tmp/fts-smoke.json
          jq -e '[.[] | .results[]? | select(.kind == "update_old") | .n] == [0]' /tmp/fts-smoke.json
          jq -e '[.[] | .results[]? | select(.kind == "update_new") | .n] == [1]' /tmp/fts-smoke.json
          jq -e '[.[] | .results[]? | select(.kind == "delete") | .n] == [0]' /tmp/fts-smoke.json
          jq -e 'any(.[] | .results[]?; (.detail // "" | ascii_upcase | contains("VIRTUAL TABLE")))' /tmp/fts-smoke.json
      - name: Clean up smoke tables
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIEW_DATABASE_NAME" == "jufexk-preview" ]]
          pnpm exec wrangler d1 execute "$PREVIEW_DATABASE_NAME" --remote --command "DROP TABLE IF EXISTS smoke_fts; DROP TABLE IF EXISTS smoke_content;"
