name: FTS5 preview capability smoke

on:
  workflow_dispatch:
    inputs:
      create_preview:
        description: Create the isolated jufexk-preview D1 when it does not exist
        required: true
        default: false
        type: boolean
      apply_migrations:
        description: Apply repository migrations to the guarded preview D1
        required: true
        default: false
        type: boolean
      run_benchmark:
        description: Run the fixed-scale catalog LIKE versus FTS benchmark
        required: true
        default: false
        type: boolean

concurrency:
  group: fts5-preview-capability-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    # The repository currently stores the Cloudflare token only in this
    # environment. The job is guarded below so it can touch only preview D1.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_DATABASE_NAME: jufexk-preview
      PRODUCTION_DATABASE_ID: 7bd119f3-b8a2-4c9d-9e70-2809396ee26c
      CREATE_PREVIEW: ${{ inputs.create_preview }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve isolated preview D1
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          info="$(pnpm exec wrangler d1 list --json)"
          database_id="$(printf '%s' "$info" | jq -r --arg name "$PREVIEW_DATABASE_NAME" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          if [[ -z "$database_id" || "$database_id" == "null" ]]; then
            if [[ "$CREATE_PREVIEW" != "true" ]]; then
              echo "No isolated preview D1 exists; rerun with create_preview=true" >&2
              exit 1
            fi
            pnpm exec wrangler d1 create "$PREVIEW_DATABASE_NAME" --location wnam
            info="$(pnpm exec wrangler d1 list --json)"
            database_id="$(printf '%s' "$info" | jq -r --arg name "$PREVIEW_DATABASE_NAME" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          fi
          [[ -n "$database_id" && "$database_id" != "null" ]]
          [[ "$database_id" != "$PRODUCTION_DATABASE_ID" ]]
          [[ "$database_id" != "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee" ]]
          jq -cn \
            --arg name "$PREVIEW_DATABASE_NAME" \
            --arg database_id "$database_id" \
            --arg migrations_dir "$GITHUB_WORKSPACE/migrations" \
            '{name:"fts5-preview-smoke",d1_databases:[{binding:"PREVIEW",database_name:$name,database_id:$database_id,migrations_dir:$migrations_dir}]}' \
            > /tmp/fts-wrangler.jsonc
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "Resolved isolated preview D1: $PREVIEW_DATABASE_NAME"
      - name: Run isolated FTS5 trigram smoke
        env:
          PREVIEW_DATABASE_ID: ${{ steps.preview.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIEW_DATABASE_ID" != "$PRODUCTION_DATABASE_ID" ]]
          prefix="fts_smoke_${GITHUB_RUN_ID}"
          sql_file=$(mktemp)
          cat > "$sql_file" <<SQL
          DROP TABLE IF EXISTS ${prefix}_fts;
          DROP TABLE IF EXISTS ${prefix}_content;
          CREATE TABLE ${prefix}_content(id INTEGER PRIMARY KEY,match_text TEXT NOT NULL,pinyin_text TEXT NOT NULL);
          CREATE VIRTUAL TABLE ${prefix}_fts USING fts5(match_text,pinyin_text,content='${prefix}_content',content_rowid='id',tokenize='trigram');
          CREATE TRIGGER ${prefix}_ai AFTER INSERT ON ${prefix}_content BEGIN INSERT INTO ${prefix}_fts(rowid,match_text,pinyin_text) VALUES(new.id,new.match_text,new.pinyin_text); END;
          CREATE TRIGGER ${prefix}_ad AFTER DELETE ON ${prefix}_content BEGIN INSERT INTO ${prefix}_fts(${prefix}_fts,rowid,match_text,pinyin_text) VALUES('delete',old.id,old.match_text,old.pinyin_text); END;
          CREATE TRIGGER ${prefix}_au AFTER UPDATE ON ${prefix}_content BEGIN INSERT INTO ${prefix}_fts(${prefix}_fts,rowid,match_text,pinyin_text) VALUES('delete',old.id,old.match_text,old.pinyin_text); INSERT INTO ${prefix}_fts(rowid,match_text,pinyin_text) VALUES(new.id,new.match_text,new.pinyin_text); END;
          INSERT INTO ${prefix}_content(id,match_text,pinyin_text) VALUES(1,'江西财经大学 course catalog','jiangxicaijingdaxue course catalog');
          INSERT INTO ${prefix}_fts(${prefix}_fts) VALUES('rebuild');
          SQL
          pnpm exec wrangler d1 execute PREVIEW --config /tmp/fts-wrangler.jsonc --remote --json --file "$sql_file" > /tmp/fts-smoke.json
          cat /tmp/fts-smoke.json
          run_query() { local label="$1"; shift; pnpm exec wrangler d1 execute PREVIEW --config /tmp/fts-wrangler.jsonc --remote --json --command "$1" > "/tmp/fts-${label}.json"; cat "/tmp/fts-${label}.json"; }
          run_query zh "SELECT COUNT(*) n FROM ${prefix}_fts WHERE ${prefix}_fts MATCH '财经大'"
          run_query ascii "SELECT COUNT(*) n FROM ${prefix}_fts WHERE ${prefix}_fts MATCH 'ourse'"
          run_query pinyin "SELECT COUNT(*) n FROM ${prefix}_fts WHERE ${prefix}_fts MATCH 'aijing'"
          pnpm exec wrangler d1 execute PREVIEW --config /tmp/fts-wrangler.jsonc --remote --command "INSERT INTO ${prefix}_content(id,match_text,pinyin_text) VALUES(2,'教师评价系统','jiaoshipingjiaxitong');"
          run_query insert "SELECT COUNT(*) n FROM ${prefix}_fts WHERE ${prefix}_fts MATCH '师评价'"
          pnpm exec wrangler d1 execute PREVIEW --config /tmp/fts-wrangler.jsonc --remote --command "UPDATE ${prefix}_content SET match_text='课程评价系统',pinyin_text='kechengpingjiaxitong' WHERE id=2;"
          run_query update_old "SELECT COUNT(*) n FROM ${prefix}_fts WHERE ${prefix}_fts MATCH '师评价'"
          run_query update_new "SELECT COUNT(*) n FROM ${prefix}_fts WHERE ${prefix}_fts MATCH '程评价'"
          pnpm exec wrangler d1 execute PREVIEW --config /tmp/fts-wrangler.jsonc --remote --command "DELETE FROM ${prefix}_content WHERE id=2;"
          run_query delete "SELECT COUNT(*) n FROM ${prefix}_fts WHERE ${prefix}_fts MATCH '程评价'"
          run_query eqp "EXPLAIN QUERY PLAN SELECT rowid FROM ${prefix}_fts WHERE ${prefix}_fts MATCH '财经大'"
          jq -e '.[0].results[0].n == 1' /tmp/fts-zh.json
          jq -e '.[0].results[0].n == 1' /tmp/fts-ascii.json
          jq -e '.[0].results[0].n == 1' /tmp/fts-pinyin.json
          jq -e '.[0].results[0].n == 1' /tmp/fts-insert.json
          jq -e '.[0].results[0].n == 0' /tmp/fts-update_old.json
          jq -e '.[0].results[0].n == 1' /tmp/fts-update_new.json
          jq -e '.[0].results[0].n == 0' /tmp/fts-delete.json
          jq -e 'any(.[] | .results[]?; (.detail // "" | ascii_upcase | contains("VIRTUAL TABLE")))' /tmp/fts-eqp.json
      - name: Apply repository migrations to preview
        if: inputs.apply_migrations
        shell: bash
        run: pnpm exec wrangler d1 migrations apply PREVIEW --config /tmp/fts-wrangler.jsonc --remote
      - name: Benchmark public catalog candidate narrowing
        if: inputs.run_benchmark
        env:
          D1_BENCH_CONFIG: /tmp/fts-wrangler.jsonc
          D1_BENCH_BINDING: PREVIEW
          D1_BENCH_DATABASE_ID: ${{ steps.preview.outputs.database_id }}
        shell: bash
        run: pnpm run benchmark:catalog-fts
      - name: Clean up smoke tables
        if: always() && steps.preview.outputs.database_id != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PREVIEW_DATABASE_NAME" == "jufexk-preview" ]]
          prefix="fts_smoke_${GITHUB_RUN_ID}"
          pnpm exec wrangler d1 execute PREVIEW --config /tmp/fts-wrangler.jsonc --remote --command "DROP TABLE IF EXISTS ${prefix}_fts; DROP TABLE IF EXISTS ${prefix}_content;"
