# Apply a locally downloaded CTA sync tree to production D1.
# GitHub-hosted runners cannot fetch p.ananas.chaoxing.com; pack
# .local-data/cta-sync on a reachable machine, upload a draft release
# asset named cta-sync.tar.gz, then dispatch this workflow.
#
#   mkdir -p /tmp/cta-pack/cta-sync/avatars
#   cp .local-data/cta-sync/bindings.json /tmp/cta-pack/cta-sync/
#   cp .local-data/cta-sync/avatars/*.webp /tmp/cta-pack/cta-sync/avatars/
#   tar -czf cta-sync.tar.gz -C /tmp/cta-pack cta-sync
#   gh release create <tag> --draft --title "CTA sync artifact" cta-sync.tar.gz
name: Apply CTA sync artifact
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag whose asset is cta-sync.tar.gz
        required: true
        type: string
concurrency:
  group: production-cta-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apply:
    name: apply
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download and unpack draft release artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid release_tag" >&2
            exit 1
          fi
          # Draft tags 404 on /releases/tags/{tag}; list releases then fetch the asset.
          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq \
            ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .assets[] | select(.name == \"cta-sync.tar.gz\") | .id" \
            | head -n 1)"
          if [[ -z "$asset_id" ]]; then
            echo "draft release asset not found for ${RELEASE_TAG}" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            -H "Accept: application/octet-stream" \
            > "${RUNNER_TEMP}/cta-sync.tar.gz"
          python3 - <<'PY'
          import os
          import tarfile
          import sys
          from pathlib import Path

          archive = Path(os.environ["RUNNER_TEMP"]) / "cta-sync.tar.gz"
          dest = Path(".local-data")
          dest.mkdir(parents=True, exist_ok=True)
          allowed_files = {"cta-sync/bindings.json"}
          with tarfile.open(archive, "r:gz") as tar:
              for info in tar.getmembers():
                  name = info.name.replace("\\", "/").removeprefix("./").rstrip("/")
                  if name in ("", "cta-sync", "cta-sync/avatars"):
                      if not info.isdir() or info.issym() or info.islnk():
                          raise SystemExit(f"unexpected member {info.name}")
                      continue
                  if name in allowed_files:
                      if not info.isfile() or info.issym() or info.islnk():
                          raise SystemExit(f"bindings.json must be a regular file: {info.name}")
                      continue
                  if name.startswith("cta-sync/avatars/") and name.endswith(".webp"):
                      rel = name[len("cta-sync/avatars/") :]
                      if "/" in rel or not rel[:-5].isdigit() or info.issym() or info.islnk() or not info.isfile():
                          raise SystemExit(f"unexpected avatar member {info.name}")
                      continue
                  raise SystemExit(f"refusing archive member {info.name}")
              tar.extractall(dest, filter="data")
          bindings = dest / "cta-sync" / "bindings.json"
          avatars = dest / "cta-sync" / "avatars"
          if not bindings.is_file() or not avatars.is_dir():
              raise SystemExit("extracted tree missing bindings.json or avatars/")
          webps = list(avatars.glob("*.webp"))
          print(f"unpacked bindings.json and {len(webps)} webp files", file=sys.stderr)
          PY
      - name: Write homepages and WebP avatars to production D1
        run: pnpm exec tsx scripts/cta-sync/apply-remote.ts --remote --apply
        # 没有真人照片的教师不写 teacher_avatars，公开接口 avatar_url 仍为 null。
